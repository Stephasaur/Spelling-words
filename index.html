<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spelling Quest</title>
<meta name="description" content="A gamified weekly spelling practice game for kids.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="confetti-layer" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar" id="topbar" hidden>
      <button class="icon-btn" id="btn-home" title="Home" aria-label="Home">🏠</button>
      <div class="level-badge" id="level-badge"></div>
      <div class="stars-counter" id="stars-counter">⭐ <span id="stars-count">0</span></div>
    </header>

    <main id="main">
      <section id="screen-home" class="screen"></section>
      <section id="screen-game" class="screen" hidden></section>
      <section id="screen-level-complete" class="screen" hidden></section>
      <section id="screen-trophy" class="screen" hidden></section>
    </main>
  </div>

  <script src="js/words.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
